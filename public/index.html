<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShareLink — a quiet place for two</title>
    <meta name="description" content="A private space for two people to save and share links together." />
    <meta name="theme-color" content="#151110" />

    <!-- One warm, compact type system for the whole app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>

    <!-- ═══════════════════════════════════════════════════════════════
         LOGIN VIEW
    ════════════════════════════════════════════════════════════════ -->
    <div class="view login-view" id="loginView" role="main">
      <div class="login-shell">

        <!-- Wordmark -->
        <header class="login-wordmark">
          <h1><span class="app-logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M10 13.5 8.7 14.8a3.4 3.4 0 0 1-4.8-4.8l3-3a3.4 3.4 0 0 1 4.8 0M14 10.5l1.3-1.3a3.4 3.4 0 0 1 4.8 4.8l-3 3a3.4 3.4 0 0 1-4.8 0M9 15l6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>sharelink</h1>
          <p>A quiet place to collect things together.</p>
        </header>

        <!-- Login form -->
        <form id="loginForm" class="login-form" novalidate aria-label="Sign in to your shared space">

          <div class="field">
            <label for="partnerName">Your name</label>
            <input
              id="partnerName"
              name="name"
              type="text"
              autocomplete="given-name"
              placeholder="How should we call you?"
              required
              aria-required="true"
            />
          </div>

          <div class="field">
            <label for="coupleCode">Shared code</label>
            <input
              id="coupleCode"
              name="code"
              type="text"
              autocomplete="current-password"
              placeholder="Your secret word or phrase"
              required
              aria-required="true"
            />
            <span class="field-hint" id="coupleCodeHint">
              Both of you use the same code to open the same shared space.
            </span>
          </div>

          <p class="form-error" id="loginError" role="alert" aria-live="assertive"></p>

          <button class="btn-enter" type="submit" id="loginSubmitBtn">
            <span class="btn-label">Open our space</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

        </form>

      </div>
    </div><!-- /login-view -->


    <!-- ═══════════════════════════════════════════════════════════════
         APP VIEW
    ════════════════════════════════════════════════════════════════ -->
    <div class="view app-view hidden" id="appView">

      <!-- ── App header ──────────────────────────────────────────── -->
      <header class="app-header">
        <div class="app-header-inner">
          <a class="app-wordmark" href="/" aria-label="ShareLink home">
            <span class="app-logo-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M10 13.5 8.7 14.8a3.4 3.4 0 0 1-4.8-4.8l3-3a3.4 3.4 0 0 1 4.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="m14 10.5 1.3-1.3a3.4 3.4 0 0 1 4.8 4.8l-3 3a3.4 3.4 0 0 1-4.8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="m9 15 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="app-brand-name">
              <span class="app-brand-share">share</span><span class="app-brand-link">link</span>
            </span>
          </a>

          <div class="header-search" id="headerSearch">
            <button class="mobile-search-toggle" id="mobileSearchToggle" type="button" aria-label="Open search" aria-expanded="false">
              <svg class="mobile-search-open-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <svg class="mobile-search-close-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <label class="header-search-field">
              <span class="sr-only">Search links</span>
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <input id="searchInput" class="search-input" type="search" placeholder="Search links, notes, tags" autocomplete="off" />
              <kbd class="search-shortcut">/</kbd>
            </label>
          </div>

          <div class="user-menu-wrap" id="userMenuWrap">
            <button class="user-chip" id="userMenuButton" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
              <span class="user-chip-name" id="spaceLabel" aria-label="Current user"></span>
              <svg class="user-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="user-dropdown hidden" id="userDropdown" role="menu" aria-label="User menu">
              <button type="button" class="user-menu-item" id="switchUserButton" role="menuitem">Switch user</button>
              <button type="button" class="user-menu-item" id="signOutButton" role="menuitem">Sign out</button>
            </div>
          </div>
        </div>
      </header>

      <!-- ── Composer ────────────────────────────────────────────── -->
      <section class="composer-section" aria-label="Add or edit a link">
        <form id="linkForm" class="composer-form" novalidate>
          <input type="hidden" id="editingId" />

          <p class="eyebrow">ADD A LINK</p>

          <!-- Primary row: URL + Save button -->
          <div class="composer-row">
            <input
              class="url-input"
              id="urlInput"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="Paste a link and press Enter"
              required
              aria-required="true"
              aria-label="URL to save"
              aria-describedby="linkError"
            />
            <button class="btn-save" id="saveButton" type="submit">
              <span class="btn-label" id="saveBtnLabel">Save</span>
              <span class="btn-loader" aria-hidden="true"></span>
            </button>
          </div>

          <div class="composer-preview hidden" id="composerPreview" aria-live="polite">
            <img class="composer-preview-favicon" id="composerFavicon" alt="" />
            <span class="composer-preview-letter hidden" id="composerFaviconLetter" aria-hidden="true"></span>
            <div class="composer-preview-copy">
              <label class="sr-only" for="titleInput">Link title</label>
              <input id="titleInput" class="composer-preview-title" type="text" placeholder="Page title" maxlength="140" aria-label="Link title" />
              <span class="composer-preview-domain" id="composerDomain"></span>
            </div>
            <span class="composer-preview-loading hidden" id="composerPreviewLoading" aria-hidden="true"></span>
          </div>
          <p class="form-error composer-error" id="linkError" role="alert" aria-live="assertive"></p>
          <button class="extras-toggle" id="extrasToggle" type="button" aria-expanded="false">Add note or tags <span aria-hidden="true">+</span></button>

          <!-- Expanded fields — revealed on URL focus, URL input, or edit mode -->
          <div class="composer-extra hidden" id="composerExtra">
            <div class="field">
              <label for="noteInput">Note</label>
              <textarea id="noteInput" name="note" rows="2" placeholder="Add a thought…" aria-label="Note" maxlength="600"></textarea>
            </div>
            <div class="field">
              <label for="tagEntryInput">Tags</label>
              <div class="tag-input-shell" id="tagInputShell">
                <div class="tag-chip-list" id="tagChipList"></div>
                <input id="tagEntryInput" type="text" placeholder="Type a tag and press Enter" autocomplete="off" aria-label="Add a tag" />
              </div>
              <input id="tagsInput" name="tags" type="hidden" />
              <div class="tag-suggestions hidden" id="tagSuggestions" aria-label="Tag suggestions"></div>
            </div>
            <div class="composer-footer">
              <button class="btn-cancel hidden" id="cancelEditButton" type="button">Discard edits</button>
            </div>
          </div>

        </form>
      </section>

      <!-- ── Status bar ──────────────────────────────────────────── -->
      <div class="list-status" id="listStatus" aria-live="polite" aria-atomic="true"></div>

      <section class="feed-toolbar" aria-label="Search and filter saved links">
        <p class="eyebrow">YOUR SHARED SHELF</p>
        <div id="filterChips" class="filter-chips" role="group" aria-label="Filter links"></div>
      </section>

      <!-- ── Empty state ─────────────────────────────────────────── -->
      <div class="empty-state hidden" id="emptyState" aria-label="No links saved yet">
        <div class="empty-inner">
          <span class="empty-glyph" aria-hidden="true">✦</span>
          <h2>Nothing shared yet. Paste a link above.</h2>
        </div>
      </div>
      <div id="noResults" class="no-results hidden" role="status">
        <span>No links match. Clear filters</span>
        <button class="clear-filters-button" id="clearFiltersButton" type="button">Clear filters</button>
      </div>

      <!-- ── Feed skeleton (shown while loading) ────────────────── -->
      <div class="feed" id="skeletonFeed" aria-hidden="true" style="padding-top:var(--sp-2)">
        <!-- Injected by JS during initial load -->
      </div>

      <!-- ── Link feed ───────────────────────────────────────────── -->
      <main class="feed" id="linkFeed" aria-label="Saved links"></main>

    </div><!-- /app-view -->

    <div class="toast hidden" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span id="toastMessage"></span>
      <span class="toast-separator" id="toastSeparator" aria-hidden="true">·</span>
      <button class="toast-undo" id="toastUndo" type="button">Undo</button>
    </div>


    <!-- ═══════════════════════════════════════════════════════════════
         TEMPLATES
    ════════════════════════════════════════════════════════════════ -->

    <!-- Day group -->
    <template id="tplDayGroup">
      <section class="day-group">
        <h2 class="day-label"><span class="day-title"></span><span class="day-count"></span></h2>
        <ol class="day-items" role="list"></ol>
      </section>
    </template>

    <!-- Link item -->
    <template id="linkTemplate">
      <li class="link-item" role="listitem" tabindex="0">
        <!-- Site favicon tile -->
        <div class="link-attribution" aria-hidden="true">
          <span class="favicon-tile">
            <img class="site-favicon" alt="" loading="lazy" />
            <span class="favicon-letter hidden" aria-hidden="true"></span>
            <svg class="favicon-fallback" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 13.5 8.7 14.8a3.4 3.4 0 0 1-4.8-4.8l3-3a3.4 3.4 0 0 1 4.8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="m14 10.5 1.3-1.3a3.4 3.4 0 0 1 4.8 4.8l-3 3a3.4 3.4 0 0 1-4.8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="m9 15 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <!-- Content -->
        <div class="link-body">
          <span class="link-title"></span>
          <div class="link-tags hidden" aria-label="Tags"></div>
          <p class="link-note"></p>
          <span class="link-meta"></span>
        </div>
        <!-- Quick actions -->
        <div class="link-controls">
          <button
            class="ctrl-btn favorite-link"
            type="button"
            aria-label="Add to favorites"
            title="Add to favorites"
          >☆</button>
          <button class="ctrl-btn preview-link" type="button" aria-label="Preview link" title="Preview link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button class="ctrl-btn copy-link" type="button" aria-label="Copy link" title="Copy link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
          <div class="link-menu-wrap">
            <button class="ctrl-btn menu-toggle" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" title="More actions">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
            </button>
            <div class="link-menu hidden" role="menu">
              <button class="menu-item edit-title-link" type="button" role="menuitem">Edit title</button>
              <button class="menu-item edit-details-link" type="button" role="menuitem">Edit note / tags</button>
              <button class="menu-item delete-link" type="button" role="menuitem">Delete link</button>
            </div>
          </div>
        </div>
      </li>
    </template>

    <!-- Skeleton item template -->
    <template id="tplSkeleton">
      <div class="skeleton-item" aria-hidden="true">
        <div class="skeleton-badge"></div>
        <div class="skeleton-body">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--domain"></div>
          <div class="skeleton-line skeleton-line--note"></div>
        </div>
      </div>
    </template>

    <div class="preview-backdrop hidden" id="previewBackdrop">
      <aside class="preview-panel" id="previewPanel" role="dialog" aria-modal="true" aria-labelledby="previewTitle" tabindex="-1">
        <button class="preview-close" id="previewClose" type="button" aria-label="Close link preview">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="preview-panel-scroll">
          <div class="preview-hero">
            <img class="preview-hero-image hidden" id="previewImage" alt="" />
            <div class="preview-hero-fallback hidden" id="previewImageFallback">
              <img id="previewFavicon" alt="" />
            <svg class="preview-fallback-glyph hidden" id="previewFallbackGlyph" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 13.5 8.7 14.8a3.4 3.4 0 0 1-4.8-4.8l3-3a3.4 3.4 0 0 1 4.8 0M14 10.5l1.3-1.3a3.4 3.4 0 0 1 4.8 4.8l-3 3a3.4 3.4 0 0 1-4.8 0M9 15l6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span id="previewFallbackDomain"></span>
            </div>
            <div class="preview-skeleton hidden" id="previewSkeleton" aria-hidden="true">
              <span class="skeleton-block skeleton-block-image"></span>
              <span class="skeleton-block skeleton-block-title"></span>
              <span class="skeleton-block skeleton-block-description"></span>
            </div>
          </div>
          <div class="preview-content">
            <h2 id="previewTitle"></h2>
            <div class="preview-loading-lines hidden" id="previewLoadingLines" aria-hidden="true">
              <span class="skeleton-block skeleton-block-title"></span>
              <span class="skeleton-block skeleton-block-description"></span>
            </div>
            <p class="preview-meta" id="previewMeta"></p>
            <p class="preview-description hidden" id="previewDescription"></p>
            <p class="preview-note hidden" id="previewNote"></p>
            <div class="preview-tags hidden" id="previewTags" aria-label="Tags"></div>
            <div class="preview-actions">
              <a class="preview-open-site" id="previewOpenSite" target="_blank" rel="noopener noreferrer">Open site ↗</a>
              <button class="preview-action" id="previewFavorite" type="button" data-panel-action="favorite">☆ Favorite</button>
              <button class="preview-action" type="button" data-panel-action="copy">Copy link</button>
              <button class="preview-action" type="button" data-panel-action="edit">Edit</button>
              <button class="preview-action preview-delete" type="button" data-panel-action="delete">Delete</button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Delete confirm dialog -->
    <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmHeading" aria-describedby="confirmMsg">
      <form method="dialog">
        <h3 id="confirmHeading">Remove this link?</h3>
        <p class="confirm-msg" id="confirmMsg"></p>
        <div class="confirm-actions">
          <button class="btn-cancel-sm" value="cancel" type="submit">Keep it</button>
          <button class="btn-delete"    value="confirm" type="submit">Delete</button>
        </div>
      </form>
    </dialog>

    <script src="/client.js" type="module"></script>
  </body>
</html>
