<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShareLink</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="login-view" id="loginView">
        <p class="eyebrow">A warm little corner for two.</p>
        <div class="panel login-panel">
          <form id="loginForm" novalidate>
            <label class="label" for="partnerName">Who is walking in?</label>
            <input id="partnerName" name="name" autocomplete="name" placeholder="Your name" required />

            <label class="label" for="coupleCode">Shared code</label>
            <input id="coupleCode" name="code" autocomplete="current-password" placeholder="0101" required />

            <p class="error" id="loginError" role="alert"></p>
            <button class="primary-button" type="submit">Open the room</button>
          </form>
        </div>
      </section>

      <section class="app-view hidden" id="appView">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="spaceLabel">Shared space</p>
            <h1>ShareLink</h1>
          </div>
          <button class="ghost-button" id="logoutButton" type="button">Switch</button>
        </header>

        <section class="panel composer">
          <form id="linkForm" novalidate>
            <input type="hidden" id="editingId" />
            <div class="form-grid">
              <label>
                <span class="label">URL</span>
                <input id="urlInput" name="url" inputmode="url" placeholder="https://example.com/find" required />
              </label>
              <label>
                <span class="label">Title</span>
                <input id="titleInput" name="title" placeholder="Optional" />
              </label>
            </div>
            <label>
              <span class="label">Note</span>
              <textarea id="noteInput" name="note" rows="3" placeholder="Optional"></textarea>
            </label>
            <p class="error" id="linkError" role="alert"></p>
            <div class="composer-actions">
              <button class="primary-button" id="saveButton" type="submit">Save link</button>
              <button class="ghost-button hidden" id="cancelEditButton" type="button">Cancel</button>
            </div>
          </form>
        </section>

        <section class="list-header">
          <h2>Saved links</h2>
          <span id="linkCount">0</span>
        </section>

        <section class="empty-state hidden" id="emptyState">
          <h2>No links yet</h2>
          <p>Paste the first thing worth coming back to.</p>
        </section>

        <section class="link-list" id="linkList" aria-live="polite"></section>
      </section>
    </main>

    <template id="linkTemplate">
      <article class="link-card">
        <div class="link-main">
          <a class="link-title" target="_blank" rel="noreferrer"></a>
          <p class="link-url"></p>
          <p class="link-note"></p>
          <p class="link-meta"></p>
        </div>
        <div class="link-actions">
          <a class="icon-button open-link" target="_blank" rel="noreferrer" aria-label="Open link" title="Open link">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3Z"/><path d="M5 5h6v2H7v10h10v-4h2v6H5V5Z"/></svg>
          </a>
          <button class="icon-button edit-link" type="button" aria-label="Edit link" title="Edit link">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 17.25-.75 3.5 3.5-.75L18.81 7.94l-2.75-2.75L4 17.25Zm15.71-10.71a1 1 0 0 0 0-1.41l-.84-.84a1 1 0 0 0-1.41 0l-.7.7 2.75 2.75.2-.2Z"/></svg>
          </button>
          <button class="icon-button delete-link" type="button" aria-label="Delete link" title="Delete link">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h8l1 2h4v2H3V6h4l1-2Zm1 6h2v8H9v-8Zm4 0h2v8h-2v-8ZM6 10h12l-1 10H7L6 10Z"/></svg>
          </button>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
